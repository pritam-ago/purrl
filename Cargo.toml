[package]
name = "purrl"
version = "0.1.0"
edition = "2024"
# edition 2024 needs 1.85, but rustyline pulls in home 0.5.12, which requires
# 1.88 -- so 1.88 is the real floor. The msrv job in CI checks it rather than
# trusting this line.
rust-version = "1.88"

# Installed binary is `purrl`
[[bin]]
name = "purrl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rustyline = "17.0.2"
reqwest = {version = "0.12.25", features= ["blocking", "json", "rustls-tls"]}
serde = "1.0.228"
serde_json = "1.0.145"
chrono = "0.4.42"
dirs = "6.0.0"
rusqlite = "0.37.0"
# 1.x API (serialize/deserialize). bincode 2.x replaced it with
# encode_to_vec/decode_from_slice and Encode/Decode derives, so bumping
# means porting vector_db.rs and re-checking the stored blob format --
# every existing index would have to be rebuilt. The caret range already
# holds it at 1.x, so the previous exact pin was doing nothing extra.
bincode = "1.3"
indicatif = "0.18.3"

[dev-dependencies]
tempfile = "3"
